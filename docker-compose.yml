version: '3.8'

services:
  backend:
    build: 
      context: ./meetwise/backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/meetinghunts
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
    networks:
      - meetinghunts-net

  frontend:
    build:
      context: ./meetwise/frontend/meetwise
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/meetinghunts
    depends_on:
      - backend
    networks:
      - meetinghunts-net

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetinghunts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meetinghunts-net

networks:
  meetinghunts-net:
    driver: bridge

volumes:
  postgres_data:
